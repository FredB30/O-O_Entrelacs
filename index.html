<script>
const l = [
"Recherche de l'auteur...","",
"Auteur localisé.","",
"Statut : ● occupé à réparer quelques entrelacs","",
"📞 Décrochage...","",
"Bonjour.","",
"Vous êtes bien sur le répondeur de O+O/Entrelacs.","",
"Personne ne peut vous répondre pour le moment.","",
"Le titulaire de cette ligne s'est absenté afin de faire baisser son niveau de glutamate...","",
"...et d'avancer quelques travaux de couture laissés en suspens.","",
"Merci de votre patience.","",
"Retour prévu : dimanche prochain.","",
"","Biiiiip.","","",""
];

const s = document.getElementById('screen');
const audio = new Audio('repondeur.mp3'); // SANS ESPACE
audio.onerror = () => console.log("Audio pas trouvé");

let i = 0; let timer;

function afficherLigne() {
  if (i < l.length) {
    s.textContent += l[i] + "\n";
    i++;
    window.scrollTo(0, document.body.scrollHeight);
    setTimeout(afficherLigne, l[i-1].includes("Biiiiip")? 2000 : 900);
  }
}

function lancer() {
  clearTimeout(timer);
  audio.currentTime = 0;
  audio.play().catch(()=>{});
  s.textContent = ""; i = 0; afficherLigne();
}

document.getElementById('replay').addEventListener('click', lancer);
lancer();
</script>
