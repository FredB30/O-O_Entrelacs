<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O+O/Entrelacs</title>
<style>
html{-webkit-text-size-adjust: none; text-size-adjust: none}
body{margin:0;padding:48px;background:#f6f2ea;color:#111;font-family: "Courier New", Courier, monospace}
.wrap{max-width:900px;margin:0 auto;text-align:center}
h1{font-size:112px!important; font-weight:700; font-family:sans-serif; margin:0; line-height:1}
h2{font-size:48px!important; font-weight:300; font-family:sans-serif; margin-bottom:32px}
#led{position:fixed;left:40px;top:40px;width:18px;height:18px;border-radius:50%;background:#c00;box-shadow:0 0 18px #f33;animation:b 1s infinite}
#screen{white-space:pre-wrap;text-align:left;font-size:22px!important; line-height:1.6; min-height:160px}
.cursor{animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#replay{margin-top:32px;padding:18px 40px!important; font-size:24px!important; font-family: sans-serif; font-weight:700; background:#c00;color:#fff;border:none;cursor:pointer; border-radius:50px; letter-spacing:1px; transition:0.2s}
#replay:disabled{background:#999; cursor:default}
</style>
</head>
<body>
<div id="led"></div>
<div class="wrap">
  <h1>O+O</h1>
  <h2>Entrelacs</h2>
  <div id="screen"></div><span class="cursor">|</span>
  <button id="replay">📞 Décrocher</button>
</div>

<script>
const l=[
"Recherche de l'auteur...","",
"Auteur localisé.","",
"Statut : ● occupé à réparer quelques entrelacs","",
"📞 Décrochage...","",
"Bonjour.","",
"Vous êtes bien sur le répondeur de O+O/Entrelacs.","",
"Personne ne peut vous répondre pour le moment.","",
"Le titulaire de cette ligne s'est absenté afin de faire baisser son niveau de glutamate...","",
"...et d'avancer quelques travaux de couture laissés en suspens.","",
"Merci de votre patience.","",
"Retour prévu : dimanche prochain.","",
"",""
];

const s=document.getElementById('screen');
const btn=document.getElementById('replay');
let i=0;

function afficherLigne(){
  if(i<l.length){
    s.textContent+=l[i]+"\n";
    i++;
    window.scrollTo(0,document.body.scrollHeight);
    setTimeout(afficherLigne,900);
  }
}

function lancer(){
  btn.disabled = true;
  btn.textContent = "🔴 En cours...";

  s.textContent="";
  i=0;

  // L'audio part car c'est suite à un clic
  const audio = new Audio('repondeur.mp3');
  audio.play().catch(()=>{console.log("audio bloqué")});

  // Quand l'audio est fini, on réactive le bouton
  audio.onended = () => {
    btn.disabled = false;
    btn.textContent = "📞 Raccrocher et Relancer";
  }

  afficherLigne();
}

btn.onclick=lancer;
lancer(); // 1er lancement auto, sans son
</script>
</body>
</html>
