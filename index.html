<script>
const l = [
  "Recherche de l'auteur...","","Auteur localisé.","","Statut : ● occupé à réparer quelques entrelacs","","📞 Décrochage...","","Bonjour.","","Vous êtes bien sur le répondeur de O+O/Entrelacs.","","Personne ne peut vous répondre pour le moment.","","Le titulaire de cette ligne s'est absenté afin de faire baisser son niveau de glutamate...","","...et d'avancer quelques travaux de couture laissés en suspens.","","Merci de votre patience.","","Retour prévu : dimanche prochain.","","","Biiiiiiiiiiiiip.","","","","","",""
];

const s = document.getElementById('screen');
const audio = new Audio('https://cdn.meta.ai/audio/oil://manifold/abra_user_uploads/flat/1606468514331124');
let i = 0;
let timer;

function afficherLigne() {
  if (i < l.length) {
    s.textContent += l[i] + "\n";
    i++;
    window.scrollTo(0, document.body.scrollHeight);
    const delai = l[i-1].includes("Biiiiip")? 2000 : 900;
    timer = setTimeout(afficherLigne, delai);
  }
}

function lancer() {
  
  clearTimeout(timer);
  s.textContent = "";
  i = 0;
  afficherLigne();
}

// Lance l'audio + le texte au démarrage
window.onload = lancer;
</script>
