<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O+O/Entrelacs - Répondeur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="led"></div>

<div class="wrap">
  <h1>O+O</h1>
  <h2>Entrelacs</h2>
  <div id="screen"></div><span class="cursor">|</span>
  <button id="replay" onclick="lancer()">Relancer</button>
</div>

<script>
  const l = [
    "Recherche de l'auteur...",
    "",
    "Auteur localisé.",
    "",
    "Statut : ● occupé à réparer quelques entrelacs",
    "",
    "📞 Décrochage...",
    "",
    "Bonjour.",
    "",
    "Vous êtes bien sur le répondeur de O+O/Entrelacs.",
    "",
    "Personne ne peut vous répondre pour le moment.",
    "",
    "Le titulaire de cette ligne s'est absenté afin de faire baisser son niveau de glutamate...",
    "",
    "...et d'avancer quelques travaux de couture laissés en suspens.",
    "",
    "Merci de votre patience.",
    "",
    "Retour prévu : dimanche prochain.",
    "",
    "",
    "Biiiiiiiiip.",
    "",
    "",
    "",
    "",
    "",
    ""
  ];

  const s = document.getElementById('screen');
  let i = 0;
  let timer;

  function afficherLigne() {
    if (i < l.length) {
      s.textContent += l[i] + "\n";
      i++;
      window.scrollTo(0, document.body.scrollHeight); /* scroll auto */
      const delai = l[i-1].includes("Biiiiip")? 2000 : 900;
      timer = setTimeout(afficherLigne, delai);
    }
  }

  function lancer() {
    clearTimeout(timer);
    s.textContent = "";
    i = 0;
    afficherLigne();
  }

  lancer();
</script>

</body>
</html>
