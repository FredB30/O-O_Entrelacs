<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O+O/Entrelacs</title>
<style>
html{-webkit-text-size-adjust: none; text-size-adjust: none}
body{margin:0;padding:48px;background:#f6f2ea;color:#111;font-family: "Courier New", Courier, monospace}
.wrap{max-width:900px;margin:0 auto;text-align:center}
h1{font-size:112px!important; font-weight:700; font-family:sans-serif; margin:0; line-height:1}
h2{font-size:48px!important; font-weight:300; font-family:sans-serif; margin-bottom:32px}
#led{position:fixed;left:40px;top:40px;width:18px;height:18px;border-radius:50%;background:#c00;box-shadow:0 0 18px #f33;animation:b 1s infinite}
#screen{white-space:pre-wrap;text-align:left;font-size:22px!important; line-height:1.6; min-height:160px}
.cursor{animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#replay{margin-top:32px;padding:16px 32px!important; font-size:22px!important; font-family: "Courier New", monospace; background:#111;color:#f6f2ea;border:none;cursor:pointer; border-radius:0}
</style>
</head>
<body>
<div id="led"></div>
<div class="wrap">
  <h1>O+O</h1>
  <h2>Entrelacs</h2>
  <div id="screen"></div><span class="cursor">|</span>
  <button id="replay">Relancer</button>
</div>

<script>
const l=["Recherche de l'auteur...","","Auteur localisé.","","Statut : ● occupé à réparer quelques entrelacs","","📞 Décrochage...","","Bonjour.","","Vous êtes bien sur le répondeur de O+O/Entrelacs.","","Personne ne peut vous répondre pour le moment.","","Le titulaire de cette ligne s'est absenté afin de faire baisser son niveau de glutamate...","","...et d'avancer quelques travaux de couture laissés en suspens.","","Merci de votre patience.","","Retour prévu : dimanche prochain.","","","Biiiiip.","","",""];
const s=document.getElementById('screen');let i=0;
function afficherLigne(){if(i<l.length){s.textContent+=l[i]+"\n";i++;window.scrollTo(0,document.body.scrollHeight);setTimeout(afficherLigne,l[i-1].includes("Biiiiip")?2000:900);}}
function lancer(){s.textContent="";i=0;afficherLigne();}
document.getElementById('replay').onclick=lancer;
lancer();
</script>
</body>
</html>
